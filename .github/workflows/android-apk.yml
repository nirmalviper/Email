name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password'
        required: false
      branch:
        description: 'Branch'
        required: true
        default: 'master'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
    
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Check signing configuration
      id: signing
      env:
        INPUT_PASSWORD: ${{ github.event.inputs.password }}
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      run: |
        if [[ -n "$INPUT_PASSWORD" && -n "$KEYSTORE" && -n "$KEYSTORE_PROPERTIES" && -n "$LOCAL_PROPERTIES" ]]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Signing secrets are incomplete; building an unsigned githubDebug APK."
        fi

    - name: Mask password
      if: steps.signing.outputs.configured == 'true'
      env:
        INPUT_PASSWORD: ${{ github.event.inputs.password }}
      run: |
        echo "::add-mask::$INPUT_PASSWORD"
        printf 'PASSWORD=%s\n' "$INPUT_PASSWORD" >> "$GITHUB_ENV"

    - name: Decrypt secrets
      if: steps.signing.outputs.configured == 'true'
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      run: |
        printf '%s' "$KEYSTORE" > keystore.asc
        gpg -d --passphrase "${PASSWORD}" --batch keystore.asc > Android.keystore
        printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties.asc
        gpg -d --passphrase "${PASSWORD}" --batch keystore.properties.asc > keystore.properties
        printf '%s' "$LOCAL_PROPERTIES" > local.properties.asc
        gpg -d --passphrase "${PASSWORD}" --batch local.properties.asc > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      env:
        SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1"
      run: |
        if [[ "$SIGNING_CONFIGURED" == "true" ]]; then
          ./gradlew --no-daemon --max-workers=1 assembleGithubRelease
        else
          ./gradlew --no-daemon --max-workers=1 assembleGithubDebug
        fi

    - name: Upload APK (signed release)
      if: steps.signing.outputs.configured == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: APK (signed release)
        path: app/build/outputs/apk/github/release/*.apk
        if-no-files-found: error

    - name: Upload APK (unsigned debug)
      if: steps.signing.outputs.configured != 'true'
      uses: actions/upload-artifact@v6
      with:
        name: APK (unsigned debug)
        path: app/build/outputs/apk/github/debug/*.apk
        if-no-files-found: error
