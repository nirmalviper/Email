name: Android CI
run-name: ${{github.workflow}} - ${{vars.TAG}} - ${{github.sha}}

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password'
        required: false
      branch:
        description: 'Branch'
        required: true
        default: 'master'

permissions:
    id-token: write
    contents: read
    attestations: write

jobs:
  build:

    runs-on: ubuntu-latest

    #https://github.com/actions/checkout
    #https://github.com/actions/setup-java
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Check signing configuration
      id: signing
      env:
        INPUT_PASSWORD: ${{ github.event.inputs.password }}
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      run: |
        if [[ -n "$INPUT_PASSWORD" && -n "$KEYSTORE" && -n "$KEYSTORE_PROPERTIES" && -n "$LOCAL_PROPERTIES" ]]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Signing secrets are incomplete; building an unsigned githubDebug APK."
        fi

    #https://github.com/actions/runner/issues/643
    - name: Mask password
      if: steps.signing.outputs.configured == 'true'
      env:
        INPUT_PASSWORD: ${{ github.event.inputs.password }}
      run: |
        echo "::add-mask::$INPUT_PASSWORD"
        printf 'PASSWORD=%s\n' "$INPUT_PASSWORD" >> "$GITHUB_ENV"

    #https://stefma.medium.com/how-to-store-a-android-keystore-safely-on-github-actions-f0cef9413784
    #gpg -c --armor --s2k-mode 3 --s2k-digest-algo SHA256 --s2k-count 10000000 --cipher-algo AES-256 <file>
    - name: Decrypt secrets
      if: steps.signing.outputs.configured == 'true'
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      run: |
        printf '%s' "$KEYSTORE" > keystore.asc
        gpg -d --passphrase "${PASSWORD}" --batch keystore.asc > Android.keystore
        printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties.asc
        gpg -d --passphrase "${PASSWORD}" --batch keystore.properties.asc > keystore.properties
        printf '%s' "$LOCAL_PROPERTIES" > local.properties.asc
        gpg -d --passphrase "${PASSWORD}" --batch local.properties.asc > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check with Lint
      run: ./gradlew --no-daemon --max-workers=1 --no-build-cache --no-configuration-cache lintGithubRelease

    - name: Build with Gradle
      env:
        SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1"
      run: |
        if [[ "$SIGNING_CONFIGURED" == "true" ]]; then
          ./gradlew --no-daemon --max-workers=1 --no-build-cache --no-configuration-cache \
            assembleGithubRelease assembleLargeRelease assemblePlayRelease
        else
          ./gradlew --no-daemon --max-workers=1 --no-build-cache --no-configuration-cache \
            assembleGithubDebug
        fi

    #https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
    #https://github.com/actions/attest-build-provenance
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      if: steps.signing.outputs.configured == 'true'
      with:
        subject-path: 'app/build/outputs/apk/**/release/*.apk'

    #- name: Upload to BitBucket
    #  run: |
    #    ./gradlew upload -Ptarget=play-preview-${{ github.event.inputs.branch }}
    #    ./gradlew upload -Ptarget=github-snapshot-${{ github.event.inputs.branch }}
    #    ./gradlew upload -Ptarget=large-snapshot-${{ github.event.inputs.branch }}
    #https://github.com/actions/upload-artifact

    - uses: actions/upload-artifact@v6
      if: steps.signing.outputs.configured == 'true'
      with:
        name: Mapping files
        path: app/build/outputs/mapping/**/mapping.txt

    - uses: actions/upload-artifact@v6
      if: steps.signing.outputs.configured == 'true'
      with:
        name: Native debug symbols
        path: app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

    - name: Upload signed APKs
      if: steps.signing.outputs.configured == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: APK files (signed release)
        path: app/build/outputs/apk/**/release/*.apk

    - name: Upload test APK
      if: steps.signing.outputs.configured != 'true'
      uses: actions/upload-artifact@v6
      with:
        name: APK files (unsigned debug)
        path: app/build/outputs/apk/github/debug/*.apk
